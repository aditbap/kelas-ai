name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Linter
        run: npm run lint
      - name: Generate Next.js Route Types
        run: npx next typegen
      - name: Type Check
        run: npx tsc --noEmit
      - name: Unit Tests
        run: npm test
      - name: Build
        run: npm run build
